<script id="b71808-sticky-offset">
(function(){
  function update(){
    var shell=document.getElementById('stickyShell');
    var spacer=document.getElementById('b71808StickySpacer');
    if(!shell||!spacer)return;
    var hidden=document.body.classList.contains('presentation-mode')||document.body.classList.contains('screenshot-mode');
    var h=hidden?0:Math.ceil(shell.getBoundingClientRect().height);
    spacer.style.setProperty('height',h+'px','important');
    spacer.style.setProperty('min-height',h+'px','important');
    spacer.style.setProperty('flex','0 0 '+h+'px','important');
    document.documentElement.style.setProperty('--sticky-shell-height',h+'px');
  }
  function init(){
    update();
    var shell=document.getElementById('stickyShell');
    if(shell&&window.ResizeObserver)new ResizeObserver(update).observe(shell);
    if(document.body&&window.MutationObserver)new MutationObserver(update).observe(document.body,{attributes:true,attributeFilter:['class']});
    window.addEventListener('resize',update,{passive:true});
    window.addEventListener('orientationchange',update,{passive:true});
    window.addEventListener('load',update);
    requestAnimationFrame(update);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
