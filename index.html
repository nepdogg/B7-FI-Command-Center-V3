<script id="b71808-sticky-offset">
(function(){
  function update(){
    var shell=document.getElementById('stickyShell');
    var spacer=document.getElementById('b71808StickySpacer');
    if(!shell||!spacer)return;
    var hidden=document.body.classList.contains('presentation-mode')||document.body.classList.contains('screenshot-mode');
    var h=hidden?0:Math.ceil(shell.getBoundingClientRect().height);
    spacer.style.setProperty('height',h+'px','important');
    spacer.style.setProperty('min-height',h+'px','important');
    spacer.style.setProperty('flex','0 0 '+h+'px','important');
    document.documentElement.style.setProperty('--sticky-shell-height',h+'px');
  }
  function init(){
    update();
    var shell=document.getElementById('stickyShell');
    if(shell&&window.ResizeObserver)new ResizeObserver(update).observe(shell);
    if(document.body&&window.MutationObserver)new MutationObserver(update).observe(document.body,{attributes:true,attributeFilter:['class']});
    window.addEventListener('resize',update,{passive:true});
    window.addEventListener('orientationchange',update,{passive:true});
    window.addEventListener('load',update);
    requestAnimationFrame(update);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
<script id="b1241-header-logo-guard">
(function(){
 var target=document.getElementById('pageTitle'); if(!target)return;
 var locked=false;
 function ensure(){
  if(locked)return;
  var title=target.querySelector('.b1241-quarter-title');
  var logo=target.querySelector('.b1241-right-logo');
  if(title&&logo)return;
  locked=true;
  var value=target.textContent.trim()||'OPERATIONS CENTER';
  target.replaceChildren();
  title=document.createElement('span');title.className='b1241-quarter-title';title.textContent=value;
  logo=document.createElement('img');logo.className='b1241-right-logo';logo.src='assets/raiders-header-logo.webp';logo.alt='Raiders logo';
  target.append(title,logo);locked=false;
 }
 new MutationObserver(ensure).observe(target,{childList:true,subtree:false});ensure();
})();
</script>



<script id="b755-badge-geometry">
(()=>{
 'use strict';
 const H=64, GAP=7;
 const set=(e,k,v)=>e.style.setProperty(k,v,'important');
 function apply(){
  const app=document.getElementById('app'); if(!app)return;
  app.querySelectorAll('.c11-badges,.fleet-badges,.v1222-badge-grid,.b7-editor-badge-grid').forEach(grid=>{
   const props={'display':'grid','grid-template-columns':'repeat(3,minmax(0,1fr))','grid-template-rows':'none','grid-auto-rows':H+'px','gap':GAP+'px','align-items':'stretch','align-content':'start','height':'auto','min-height':'0','max-height':'none','transform':'none'};
   Object.entries(props).forEach(([k,v])=>set(grid,k,v));
   Array.from(grid.children).forEach(b=>{
    if(!b.matches('.c11-badge,.v10-badge,.v10-wafer-badge,.c11-wafer-badge,.equipment-badge,button'))return;
    Object.entries({'box-sizing':'border-box','height':H+'px','min-height':H+'px','max-height':H+'px','flex':'0 0 '+H+'px','align-self':'stretch','margin':'0','padding':'6px','display':'flex','flex-direction':'column','justify-content':'center','align-items':'center','background-color':'#000','background-image':'none','border':'1px solid #999','color':'#fff','white-space':'normal','line-height':'1.2','overflow':'hidden','transform':'none'}).forEach(([k,v])=>set(b,k,v));
    if(b.matches('.v10-wafer-badge,.c11-wafer-badge,.equipment-badge') || /SYSTEM WAFERS|COMPUTER TRACKING|COMPONENT TRACKING/i.test(b.textContent||'')){
      if(b.matches('.v10-wafer-badge,.c11-wafer-badge,.equipment-badge') || b.textContent?.trim().startsWith('SYSTEM WAFERS') || b.textContent?.trim().startsWith('COMPUTER TRACKING') || b.textContent?.trim().startsWith('COMPONENT TRACKING'))set(b,'grid-column','1 / -1');
    }
   });
  });
  app.querySelectorAll('.b783-date-row > .b783-date-badge').forEach(b=>{
   ['height','min-height','max-height'].forEach(k=>set(b,k,H+'px'));
   set(b,'flex-shrink','0');set(b,'box-sizing','border-box');
  });
  app.querySelectorAll('.c11-badge-region').forEach(r=>{
   set(r,'min-height','0');set(r,'overflow-y','auto');set(r,'overflow-x','hidden');
  });
 }
 function init(){const app=document.getElementById('app');if(!app)return;let pending=false;
  new MutationObserver(records=>{if(!records.some(r=>r.type==='childList'))return;if(pending)return;pending=true;requestAnimationFrame(()=>{pending=false;apply()})}).observe(app,{subtree:true,childList:true});
  apply();window.addEventListener('resize',apply,{passive:true});
  window.b755BadgeDiagnostics=()=>Array.from(document.querySelectorAll('#app .c11-badges > *,#app .fleet-badges > *')).filter(e=>e.matches('.v10-badge,.c11-badge,.equipment-badge,.v10-wafer-badge,.c11-wafer-badge')).map(e=>({name:e.textContent.trim().slice(0,40),height:Math.round(e.getBoundingClientRect().height),cssHeight:getComputedStyle(e).height}));
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();
</script>
